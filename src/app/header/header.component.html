<nav class="navigation" aria-label="Main Navigation">
  <ul class="nav-list">
    @for (link of navLinks; track link.id) {
      <li class="nav-list-item">
        <a 
          [routerLink]="link.url" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-label]="link.title"
        >
          {{ link.title }}
        </a>
      </li>
    }
  </ul>
</nav>
